<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>Lexa AI - Your Intelligent Assistant</title>

    <meta name="description" content="Lexa AI is your emotionally intelligent AI companion powered by advanced language models. Chat naturally, search the web, generate images, and get personalized assistance." />
    <meta name="author" content="Lexa AI" />
    <meta name="theme-color" content="#0a0f1a" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://lexa-ai.com/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Lexa AI - Your Intelligent Assistant" />
    <meta property="og:description" content="Your emotionally intelligent AI companion powered by advanced AI models." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lexa-ai.com/" />
    <meta property="og:image" content="https://lexa-ai.com/icon-512.png" />
    <meta property="og:site_name" content="Lexa AI" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lexa AI - Your Intelligent Assistant" />
    <meta name="twitter:description" content="Your emotionally intelligent AI companion powered by advanced AI models." />
    <meta name="twitter:image" content="/icon-512.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Lexa AI",
      "description": "Your emotionally intelligent AI companion powered by advanced language models",
      "url": "http://localhost:8080/",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "Web"
    }
    </script>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3188579524419526" crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>

  <body>
    <noscript>
      <div style="padding: 2rem; font-family: sans-serif; text-align: center; color: white; background: #0a0f1a; height: 100vh; margin: 0;">
        <h2>JavaScript is Required</h2>
        <p>Lexa AI requires JavaScript to be enabled in order to function properly. Please enable JavaScript in your browser settings and reload the page.</p>
      </div>
    </noscript>
    <div id="root">
      <div style="display: flex; height: 100vh; width: 100vw; align-items: center; justify-content: center; background-color: #0a0f1a;">
        <style>
          .lexa-loader { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #6366f1; border-top-color: transparent; animation: lexa-spin 1s linear infinite; }
          @keyframes lexa-spin { to { transform: rotate(360deg); } }
        </style>
        <div class="lexa-loader"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
